# Replace namespace and allocated node names before applying to a test cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-manager-st
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-manager-st
  namespace: arc-runners
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
  - apiGroups: [batch.volcano.sh]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [ft.hygon.io]
    resources: [faultevents]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [ft.hygon.io]
    resources: [faultevents/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-manager-st
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: cluster-manager-st
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-manager-st
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-manager-st
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [test-node-a, test-node-b]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [test-node-a]
    verbs: [patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [create]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [faultevents.ft.hygon.io]
    verbs: [get, delete]
  # Read-only inventory prevents deleting a CRD used by another namespace.
  - apiGroups: [ft.hygon.io]
    resources: [faultevents]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-manager-st
subjects:
  - kind: ServiceAccount
    name: cluster-manager-st
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-manager-st
