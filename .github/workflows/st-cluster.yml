name: Cluster ST

on:
  push:
    branches: [main]
    paths:
      - "hcu-envcheck/**"
      - "hcu-training-reliability/**"
      - "hcu_resiliency_ext/**"

permissions:
  contents: read

# Serialize cluster users across refs; do not interrupt an older recovery case.
concurrency:
  group: hcu-cluster-st
  cancel-in-progress: false

jobs:
  st:
    name: Environment and worker recovery ST
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, nmz2, bw1100]
    # Temporary workflow guard, covering prepare, two per-case budgets and cleanup.
    timeout-minutes: 90
    env:
      ST_CONTROL_PYTHON: ${{ vars.ST_CONTROL_PYTHON }}
      ST_SHARED_ROOT: ${{ vars.ST_SHARED_ROOT }}
      ST_HOSTFILE: ${{ vars.ST_HOSTFILE }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate CI variables
        shell: bash
        run: |
          set -euo pipefail
          : "${ST_CONTROL_PYTHON:?Set ST_CONTROL_PYTHON}"
          : "${ST_SHARED_ROOT:?Set ST_SHARED_ROOT}"
          : "${ST_HOSTFILE:?Set ST_HOSTFILE}"
          [[ "$ST_CONTROL_PYTHON" == /* && -x "$ST_CONTROL_PYTHON" ]]
          [[ "$ST_SHARED_ROOT" == /* && "$ST_HOSTFILE" == /* && -r "$ST_HOSTFILE" ]]

      - name: Run offline ST regressions
        shell: bash
        run: |
          set -euo pipefail
          "$ST_CONTROL_PYTHON" -B -m pytest -c tests/st/pytest.ini tests/st/unit -q

      - name: Run allocated-node ST
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/hcu-st-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/artifacts"
          mkdir -p "$artifacts"
          git rev-parse HEAD > "$artifacts/source-commit.txt"
          "$ST_CONTROL_PYTHON" -B tests/st/ci_entry.py run \
            --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --artifacts "$artifacts" 2>&1 | tee "$artifacts/entry.log"

      - name: Recheck owned resources and collect receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          run="$ST_SHARED_ROOT/ci-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          artifacts="$RUNNER_TEMP/hcu-st-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/artifacts"
          if [[ -x "$ST_CONTROL_PYTHON" && -f "$run/ci-run.json" ]]; then
            status=0
            "$ST_CONTROL_PYTHON" -B tests/st/ci_entry.py cleanup --run-root "$run" || status=$?
            "$ST_CONTROL_PYTHON" -B tests/st/ci_entry.py collect --run-root "$run" --artifacts "$artifacts" || status=$?
            exit "$status"
          fi

      - name: Upload ST receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cluster-st-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcu-st-${{ github.run_id }}-${{ github.run_attempt }}/artifacts
          if-no-files-found: warn
          retention-days: 14
