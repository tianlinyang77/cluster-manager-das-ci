name: Cluster ST

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tests/st/**"
      - "hcu-envcheck/**"
      - "hcu-training-reliability/**"
      - "hcu_resiliency_ext/**"
      - "nvidia_resiliency_ext/**"
      - "hygon-ft-k8s/**"
      - ".github/ci/k8s/**"
      - ".github/workflows/st-cluster.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcu-cluster-st
  cancel-in-progress: false

jobs:
  unit:
    name: Kubernetes ST control regressions
    runs-on: hygon-cpu
    container:
      image: ${{ vars.ST_TRAINING_IMAGE }}
    timeout-minutes: 10
    steps:
      - name: Checkout test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run offline control and checkpoint regressions
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            pytest==9.1.1 requests==2.34.2 PyYAML==6.0.3 websocket-client==1.9.2
          python3 -B -m pytest -c tests/st/pytest.ini \
            tests/st/unit/test_k8s_ci.py tests/st/unit/test_checkpoint_mode.py -q

  recovery:
    name: Cross-node checkpoint recovery
    needs: unit
    # The controller must not reserve the cards needed by the training Pods.
    runs-on: hygon-cpu
    container:
      image: ${{ vars.ST_TRAINING_IMAGE }}
    timeout-minutes: 90
    env:
      ST_HCU_POOL: hygon-bw1100-8card
      ST_K8S_NAMESPACE: ${{ vars.ST_K8S_NAMESPACE || 'arc-runners' }}
      ST_K8S_NODES: ${{ vars.ST_K8S_NODES }}
      ST_TRAINING_IMAGE: ${{ vars.ST_TRAINING_IMAGE }}
      ST_ALLOW_DEGRADED: ${{ vars.ST_ALLOW_DEGRADED || 'false' }}
      ST_SHARED_ROOT: ${{ vars.ST_SHARED_ROOT || '/ci_public/cluster-manager-st' }}
      ST_RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      ST_SOURCE_ROOT: ${{ github.workspace }}/source
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Configure per-run paths
        shell: bash
        run: |
          printf 'ST_K8S_ARTIFACTS=%s\nKUBECONFIG=%s\nPYTHONPATH=%s\n' \
            "$RUNNER_TEMP/cluster-st-artifacts" "$RUNNER_TEMP/cluster-st.kubeconfig" \
            "$RUNNER_TEMP/st-control-deps" >> "$GITHUB_ENV"

      - name: Checkout trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: controller
          persist-credentials: false

      - name: Checkout training source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false

      - name: Configure cluster access and control dependencies
        shell: bash
        env:
          ST_KUBECONFIG: ${{ secrets.ST_KUBECONFIG }}
        run: |
          set -euo pipefail
          : "${ST_KUBECONFIG:?Set the ST_KUBECONFIG repository secret for the test cluster}"
          : "${ST_K8S_NODES:?Set ST_K8S_NODES to the fault node and standby node}"
          : "${ST_TRAINING_IMAGE:?Set a digest-pinned ST_TRAINING_IMAGE}"
          mkdir -p "$ST_K8S_ARTIFACTS"
          umask 077
          printf '%s' "$ST_KUBECONFIG" > "$KUBECONFIG"
          python3 -m pip install --disable-pip-version-check \
            --target "$PYTHONPATH" --report "$ST_K8S_ARTIFACTS/control-pip-report.json" \
            kubernetes==30.1.0 requests==2.34.2 PyYAML==6.0.3 websocket-client==1.9.2

      - name: Prepare fixed Bridge source and private runtime dependencies
        shell: bash
        run: python3 -B controller/.github/ci/k8s/prepare.py

      - name: Inject one scoped fault and verify cross-node recovery
        shell: bash
        run: python3 -B controller/.github/ci/k8s/run_recovery.py

      - name: Confirm shared checkpoints after training Pod deletion
        shell: bash
        run: python3 -B controller/.github/ci/k8s/collect.py

      - name: Recheck owned resources and remove the test taint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$KUBECONFIG" && -f "$ST_K8S_ARTIFACTS/active-crossnode.json" ]]; then
            python3 -B controller/.github/ci/k8s/cleanup.py
          fi

      - name: Remove temporary cluster credentials
        if: always()
        shell: bash
        run: rm -f -- "$KUBECONFIG"

      - name: Upload ST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cluster-st-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cluster-st-artifacts
          if-no-files-found: warn
          retention-days: 14
