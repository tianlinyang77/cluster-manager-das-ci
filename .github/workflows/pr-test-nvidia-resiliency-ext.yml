name: PR Test (nvidia_resiliency_ext)

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "nvidia_resiliency_ext/**"
      - ".github/actionlint.yaml"
      - ".github/workflows/_run-unit-tests.yml"
      - ".github/workflows/pr-test-nvidia-resiliency-ext.yml"
      - ".gitmodules"

concurrency:
  group: pr-test-nvidia-resiliency-ext-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/_run-unit-tests.yml
    with:
      module-id: nvidia-resiliency-ext
      test-name: nvidia_resiliency_ext unit tests
      test-path: nvidia_resiliency_ext/tests
