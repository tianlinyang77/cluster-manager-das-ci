name: Reusable unit test

on:
  workflow_call:
    inputs:
      module-id:
        description: Stable identifier used in isolated test directories.
        required: true
        type: string
      test-name:
        description: Check name shown in GitHub Actions.
        required: true
        type: string
      test-path:
        description: Repository-relative pytest target.
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    name: ${{ inputs.test-name }}
    runs-on: hygon-build
    container:
      image: ${{ vars.ST_TRAINING_IMAGE }}
    timeout-minutes: 30
    env:
      CLUSTER_MANAGER_CI_IMAGE: ${{ vars.ST_TRAINING_IMAGE }}
      CI_MODULE_ID: ${{ inputs.module-id }}
      CI_TEST_PATH: ${{ inputs.test-path }}
    steps:
      - name: Validate fixed runtime and configure test directories
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CLUSTER_MANAGER_CI_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Set ST_TRAINING_IMAGE to the reviewed digest-pinned CI runtime." >&2
            exit 1
          fi
          root="/tmp/cluster-manager-unit-$CI_MODULE_ID"
          mkdir -p "$root/deps" "$root/workspace"
          printf 'CI_DEPS_DIR=%s\nCI_WORKSPACE=%s\n' "$root/deps" "$root/workspace" >> "$GITHUB_ENV"

      - name: Checkout PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Install fixed test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --index-url https://pypi.tuna.tsinghua.edu.cn/simple \
            --target "$CI_DEPS_DIR" numpy==2.3.5 pytest==9.1.1

      - name: Run ${{ inputs.test-name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /opt/dtk/env.sh ]]; then
            set +u
            source /opt/dtk/env.sh
            set -u
          fi
          cp -a --no-preserve=ownership "$GITHUB_WORKSPACE/." "$CI_WORKSPACE/"
          cd "$CI_WORKSPACE"
          export HOME=/tmp
          export PYTHONDONTWRITEBYTECODE=1
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          export PYTHONPATH="$CI_DEPS_DIR:$CI_WORKSPACE:$CI_WORKSPACE/hcu-training-reliability:$CI_WORKSPACE/hcu-envcheck:$CI_WORKSPACE/hcu_resiliency_ext:$CI_WORKSPACE/hygon-ft-k8s:$CI_WORKSPACE/stack-analyzer"
          test_path="$CI_TEST_PATH"
          # Base-branch callers can still reference directories renamed by the PR.
          if [[ "$test_path" == cluster_manager/test/unit && ! -d "$test_path" && -d hcu-training-reliability/test/unit ]]; then
            test_path=hcu-training-reliability/test/unit
          fi
          if [[ "$test_path" == hcu_resiliency_ext/tests && ! -d "$test_path" && -d nvidia_resiliency_ext/tests ]]; then
            test_path=nvidia_resiliency_ext/tests
          fi
          if [[ "$test_path" == nvidia_resiliency_ext/tests ]]; then
            export PYTHONPATH="$PYTHONPATH:$CI_WORKSPACE/nvidia_resiliency_ext"
          fi
          exec python3 -m pytest -c /dev/null --rootdir="$CI_WORKSPACE" \
            --import-mode=importlib -p no:cacheprovider -q "$test_path"
